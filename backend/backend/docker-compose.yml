services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qlcsvc-sql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Aa123456!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./sql-init:/docker-entrypoint-initdb.d

volumes:
  sql_data: